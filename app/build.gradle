plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
}

// The one place the version lives is package.json; 0.2.0 becomes versionName "0.2.0" and versionCode 200.
def pkg = new groovy.json.JsonSlurper().parse(file("../package.json"))
def (major, minor, patch) = pkg.version.tokenize(".").collect { it.toInteger() }

android {
  namespace = "to.holepunch.bare.android"
  compileSdk = 35

  defaultConfig {
    applicationId = "com.github.tibocub.swarmwire"
    minSdk = 29
    targetSdk = 35
    versionCode = major * 10000 + minor * 100 + patch
    versionName = pkg.version
    // -Pabis=arm64-v8a builds phones only (what the release uses); the default also covers the emulator.
    ndk { abiFilters(*(project.findProperty("abis") ?: "x86_64,arm64-v8a").split(",")) }
  }

  // Release builds are signed with the keystore the workflow provides; without one they fall back to the debug key.
  signingConfigs {
    release {
      def keystore = System.getenv("KEYSTORE_FILE")
      if (keystore) {
        storeFile file(keystore)
        storePassword System.getenv("KEYSTORE_PASSWORD")
        keyAlias System.getenv("KEY_ALIAS") ?: "swarmwire"
        keyPassword System.getenv("KEYSTORE_PASSWORD")
      }
    }
  }

  buildTypes {
    release {
      signingConfig = signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      jniLibs.srcDirs "src/main/addons", "libs/bare-kit/jni"
    }
  }
}

tasks.register("link", Exec) {
  workingDir ".."

  commandLine([
    "node_modules/.bin/bare-link",
    "--preset", "android",
    "--needs", "libbare-kit.so",
    "--out", "app/src/main/addons"
  ])
}

tasks.register("packApp", Exec) {
  workingDir ".."

  commandLine([
    "node_modules/.bin/bare-pack",
    "--preset", "android",
    "--out", "app/src/main/assets/app.bundle",
    "app/src/main/js/app.js"
  ])
}

tasks.register("pack") {
  dependsOn packApp
}

preBuild.dependsOn link, pack

dependencies {
  api fileTree(dir: "libs", include: ["bare-kit/classes.jar"])
  implementation "com.journeyapps:zxing-android-embedded:4.3.0"
  implementation "androidx.core:core:1.13.1" // ContextCompat, which the scanner expects the app to provide
}
